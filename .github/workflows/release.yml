name: Release

# Push a tag like v1.2.0 to publish a GitHub Release with:
#   - standalone executables (Windows x64, macOS arm64 + Intel, Linux x64 + arm64)
#   - a portable Node bundle (any OS with Node 18+)
#   - a multi-arch Docker image on GHCR
#   - SHA256SUMS.txt
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.2.0)"
        required: true

permissions:
  contents: write
  packages: write

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - id: v
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

  verify:
    name: Verify (tests + A4 layout)
    needs: meta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: CHROME_PATH="$(command -v google-chrome)" npm run test:layout

  binaries:
    name: Executable (${{ matrix.name }})
    needs: [meta, verify]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x64,   os: ubuntu-latest,    target: node22-linux-x64,   ext: "" }
          - { name: linux-arm64, os: ubuntu-24.04-arm, target: node22-linux-arm64, ext: "" }
          - { name: windows-x64, os: windows-latest,   target: node22-win-x64,     ext: ".exe" }
          - { name: macos-arm64, os: macos-latest,     target: node22-macos-arm64, ext: "" }
          - { name: macos-x64,   os: macos-15-intel,   target: node22-macos-x64,   ext: "" }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Stamp the release version into the app
        run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build && npm run build:bundle
      - name: Package executable
        run: |
          mkdir -p stage
          npx pkg dist/bundle/server.cjs --config pkg.config.json --targets ${{ matrix.target }} \
            --output "stage/report-card-studio${{ matrix.ext }}" --compress GZip
      - name: Ad-hoc sign (required to run on Apple silicon)
        if: startsWith(matrix.name, 'macos')
        run: codesign --force --sign - stage/report-card-studio
      - name: Smoke test (native runners)
        run: |
          ./stage/report-card-studio${{ matrix.ext }} --version
      - name: Archive
        run: |
          cp LICENSE README.md stage/
          ARCHIVE="report-card-studio-v${{ needs.meta.outputs.version }}-${{ matrix.name }}"
          mkdir -p out
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            chmod +x stage/report-card-studio
            tar -czf "out/${ARCHIVE}.tar.gz" -C stage .
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            (cd stage && 7z a -tzip "../out/${ARCHIVE}.zip" . > /dev/null)
          else
            chmod +x stage/report-card-studio
            (cd stage && zip -qr "../out/${ARCHIVE}.zip" .)
          fi
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/*
          if-no-files-found: error

  node-bundle:
    name: Portable Node bundle
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm version "${{ needs.meta.outputs.version }}" --no-git-tag-version --allow-same-version
      - run: npm run build && npm run build:bundle
      - name: Assemble (one JS file + assets; no node_modules required)
        run: |
          D="report-card-studio-v${{ needs.meta.outputs.version }}-node"
          mkdir -p "$D/dist/bundle"
          cp dist/bundle/server.cjs "$D/dist/bundle/"
          cp -r static fonts templates package.json LICENSE README.md "$D/"
          printf '#!/bin/sh\ncd "$(dirname "$0")" && exec node dist/bundle/server.cjs "$@"\n' > "$D/start.sh"
          printf '@echo off\r\ncd /d "%%~dp0"\r\nnode dist\\bundle\\server.cjs %%*\r\n' > "$D/start.cmd"
          chmod +x "$D/start.sh"
          mkdir -p out
          zip -qr "out/$D.zip" "$D"
      - uses: actions/upload-artifact@v4
        with:
          name: bin-node
          path: out/*
          if-no-files-found: error

  docker:
    name: Docker image (GHCR)
    needs: [meta, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.prerelease == 'false' }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Publish GitHub Release
    needs: [meta, binaries, node-bundle, docker]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          pattern: bin-*
          merge-multiple: true
      - name: Checksums
        working-directory: dist-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: Report Card Studio ${{ needs.meta.outputs.tag }}
          prerelease: ${{ needs.meta.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist-artifacts/*
          body: |
            ## Downloads
            | Platform | File |
            |---|---|
            | Windows (x64) | `report-card-studio-${{ needs.meta.outputs.tag }}-windows-x64.zip` |
            | macOS (Apple silicon) | `report-card-studio-${{ needs.meta.outputs.tag }}-macos-arm64.zip` |
            | macOS (Intel) | `report-card-studio-${{ needs.meta.outputs.tag }}-macos-x64.zip` |
            | Linux (x64 / arm64) | `report-card-studio-${{ needs.meta.outputs.tag }}-linux-x64.tar.gz` / `-linux-arm64.tar.gz` |
            | Any OS with Node 18+ | `report-card-studio-${{ needs.meta.outputs.tag }}-node.zip` |
            | Docker | `docker run -p 8080:8080 ghcr.io/${{ github.repository }}:${{ needs.meta.outputs.version }}` |

            Verify downloads with `SHA256SUMS.txt`.
